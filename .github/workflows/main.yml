name: Build Nikshay Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "nikshay-automation-android-starter.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -eu
          mkdir -p /tmp/project
          unzip -q nikshay-automation-android-starter.zip -d /tmp/project
          PROJECT_DIR="/tmp/project/nikshay-automation-android"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -RIl 'in.cbbramhane.nikshayassistant' "$PROJECT_DIR" | while read -r file; do
            sed -i 's/in\.cbbramhane\.nikshayassistant/com.cbbramhane.nikshayassistant/g' "$file"
          done
          cp -R "$PROJECT_DIR"/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nikshay-automation-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
