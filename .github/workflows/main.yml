name: Build Nikshay Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "nikshay-automation-android-starter.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p /tmp/project
          unzip -q nikshay-automation-android-starter.zip -d /tmp/project
          cp -R /tmp/project/nikshay-automation-android/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nikshay-automation-assistant
          path: app/build/outputs/apk/debug/app-debug.apk
